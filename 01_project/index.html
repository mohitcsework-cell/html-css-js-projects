<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="slider-container">

        <div class="img-container">
            <img src="https://picsum.photos/id/237/500/300" alt="image 1">
            <img src="https://picsum.photos/id/10/500/300" alt="image 2">
            <img src="https://picsum.photos/id/40/500/300" alt="image 3">
            <img src="https://picsum.photos/id/200/500/300" alt="image 4">
        </div>

        <i class="fas fa-angle-double-left btn prev"></i>
        <i class="fas fa-angle-double-right btn next"></i>

    </div>
    <script src="index.js"></script>
</body>
</html>
